<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Cairo,Tajawal,system-ui,sans-serif;color:var(--tx);background:radial-gradient(1000px 500px at 80% -10%,var(--bg2),var(--bg));background-color:var(--bg);min-height:100vh;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:640px;margin:0 auto;padding:14px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.18);animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h2,h3{margin:0 0 8px;color:var(--go)}
.mu{color:var(--mu);font-size:.85rem}
.big{font-size:2.6rem;font-weight:800;letter-spacing:1px;text-align:center}
.ar{font-size:1.25rem;line-height:2.1;text-align:center}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:linear-gradient(135deg,var(--ac),#047857);border:0;border-radius:14px;padding:10px 14px;color:#fff;cursor:pointer;min-height:44px}
button.g{background:transparent;border:1px solid var(--go);color:var(--go)}
button.r{background:#b91c1c}
input,select,textarea{background:rgba(127,127,127,.15);border:1px solid var(--bd);border-radius:12px;padding:10px;width:100%;min-height:44px}
option{color:#000}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.pr{display:flex;justify-content:space-between;align-items:center;padding:10px 6px;border-bottom:1px solid rgba(127,127,127,.2)}
.pr.n{background:rgba(16,185,129,.18);border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;background:none;color:var(--mu);font-size:.75rem;padding:4px;display:flex;flex-direction:column;gap:2px;align-items:center}
nav button.on{color:var(--go)}
.gold{background:linear-gradient(135deg,#8a6d1a,#f3d77a,#b8901f);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.ov>div{background:var(--bg2);border:1px solid var(--go);border-radius:20px;padding:18px;max-width:420px;width:100%}
#ts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:12px;z-index:60;text-align:center}
#ts div{background:var(--go);color:#000;border-radius:12px;padding:10px;margin-bottom:6px}
.tb{width:200px;height:200px;border-radius:50%;margin:10px auto;display:block;font-size:3rem;font-weight:800;background:radial-gradient(circle at 30% 30%,#34d399,#065f46);border:4px solid var(--go);box-shadow:0 0 30px rgba(16,185,129,.4)}
.tb:active{transform:scale(.94)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal div{padding:6px 0;border-radius:8px;font-size:.9rem}.cal small{display:block;color:var(--mu);font-size:.65rem}
.cal .f{color:var(--go)}.cal .t{outline:2px solid var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.tabs button{white-space:nowrap;flex:none}
</style>
</head>

 stopSensor();sens='ondeviceorientationabsolute' in window?'deviceorientationabsolute':'deviceorientation';addEventListener(sens,onOri);$('#qs').textContent='المستشعر يعمل: السهم الأخضر يشير للقبلة. إن لم تتحرك البوصلة فجهازك لا يوفر مستشعراً.'}catch(e){$('#qs').textContent='تعذّر تفعيل المستشعر.'}}

 T.forEach((x,i)=>{const k=dk+i;if(now>=x&&now<x+30000&&!SHOWN['a'+k]){SHOWN['a'+k]=1;play(i);try{if(Notification.permission=='granted')new Notification('حان الآن موعد أذان '+PN[i])}catch(e){}toast('🕌 حان موعد أذان '+PN[i])}

 if(S.rem.on){const hm=P2(t.getHours())+':'+P2(t.getMinutes());[[S.rem.m,'أذكار الصباح','m'],[S.rem.e,'أذكار المساء','e'],[S.rem.p,'ذكر اليوم','p']].forEach(([x,l,w])=>{const k='r'+w+dk;if(hm==x&&!SHOWN[k]&&!$('#md').innerHTML){SHOWN[k]=1;const a=w=='p'?([...ADH,...S.cus].find(z=>z.id==S.rem.pid)):null;modal(`<h3>${l}</h3>${a?`<div class="ar">${E(a.t)}</div>`:'<div class="ar">حان وقت الأذكار</div>'}<button data-a="${a?'closeM':'goadh'}" data-v="${w}" style="width:100%">${a?'تم':'افتح الأذكار'}</button>`)}})}}

async function sched(){try{const p=await LN.requestPermissions();if(p.display!=='granted')return;const pe=await LN.getPending();if(pe.notifications.length)await LN.cancel({notifications:pe.notifications});const out=[];let id=1;

if(out.length)await LN.schedule({notifications:out})}catch(e){console.log('sched',e)}}
const o=save;save=function(){o();clearTimeout(w);w=setTimeout(sched,2500)};sched();document.addEventListener('visibilitychange',()=>{if(!document.hidden)sched()})})();
addEventListener('error',()=>{});
render();
</script>
